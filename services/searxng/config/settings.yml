use_default_settings: true
search:
  # json output is REQUIRED by the mcp-searxng MCP server. The default SearXNG
  # image ships `html` only; without `json` the MCP breaks. Do not remove json.
  formats:
    - html
    - json
server:
  # No secret is committed, and this template is never written. On mac/Linux,
  # start-searxng.sh (run by `scout meta` and /scout:meta) generates a key with
  # `openssl rand -hex 32` into scout's state directory on first start and
  # renders a copy of this file there, with the key filled in, on every start.
  # (The Windows launcher still writes the key into its installed copy.)
  secret_key: ""
  # limiter off: single-user localhost (scout meta) is fine. If you expose this
  # SearXNG on a shared or public host, re-enable the limiter (set to true).
  limiter: false
