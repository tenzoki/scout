# scout meta — SearXNG metasearch backend (opt-in discovery layer)
#
# Started by start-searxng.sh (next to this file), which both the launcher's
# `meta` arm and the /scout:meta skill call; never on the default `scout` path.
# Default scout is zero-dependency and never references this file.
#
# start-searxng.sh copies this file into scout's user state directory
# ($STATE_DIR/searxng/, see that script) and runs it from there, so
# ./config/settings.yml below resolves to the rendered copy in the state
# directory, not to the template in the plugin. No secret lives here or in the
# template; the script generates secret_key into the state directory.
#
# `name:` pins the compose project so every caller, from whichever plugin copy,
# addresses the same project. start-searxng.sh also passes `-p scout-searxng`,
# because an exported COMPOSE_PROJECT_NAME would otherwise override `name:`. container_name stays scout-specific so it does not
# clash with any other SearXNG container.
name: scout-searxng
services:
  searxng:
    image: searxng/searxng
    container_name: scout-searxng
    restart: unless-stopped
    ports:
      - "8911:8080"
    volumes:
      - ./config/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      - SEARXNG_BASE_URL=http://localhost:8911/
